name: datamint
metadata:
  template: azd-init

services:
  api:
    project: ./backend/src/Datamint.API
    language: dotnet
    host: appservice

  web:
    project: ./frontend
    language: js
    host: staticwebapp
    dist: dist/datamint/browser
    hooks:
      # prepackage, not predeploy: `npm run build` (ng build) runs during PACKAGING, which
      # happens before the predeploy stage - patching environment.prod.ts in a predeploy hook
      # patches the source file too late, after the stale placeholder was already compiled into
      # dist/. prepackage runs before the build, so the patched value actually gets bundled in.
      prepackage:
        posix:
          shell: sh
          run: node ../scripts/patch-frontend-env.js
        windows:
          shell: pwsh
          run: node ../scripts/patch-frontend-env.js

hooks:
  postprovision:
    posix:
      shell: sh
      run: ./scripts/grant-sql-access.sh
    windows:
      shell: pwsh
      run: ./scripts/grant-sql-access.ps1
