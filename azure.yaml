name: datamint
metadata:
  template: azd-init

services:
  api:
    project: ./backend/src/Datamint.API
    language: dotnet
    host: appservice

  web:
    project: ./frontend
    language: js
    host: staticwebapp
    dist: dist/datamint/browser
    hooks:
      predeploy:
        shell: sh
        run: node ../scripts/patch-frontend-env.js
        interactive: false
        continueOnError: false

hooks:
  postprovision:
    posix:
      shell: sh
      run: ./scripts/grant-sql-access.sh
    windows:
      shell: pwsh
      run: ./scripts/grant-sql-access.ps1
